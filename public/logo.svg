<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 725 210" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;display=swap');
      .logo-zoe {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 106px;
        fill: #000000;
        letter-spacing: -0.025em;
      }
      .logo-digitals {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 106px;
        fill: #007A00;
        letter-spacing: -0.025em;
      }
    </style>
  </defs>

  <!-- Perspective Frame Around "Digitals" -->
  <path
    d="M 234 80 L 234 38 L 706 12 L 688 196 L 234 172 L 234 140"
    fill="none"
    stroke="#000000"
    stroke-width="11"
    stroke-linecap="square"
    stroke-linejoin="miter"
    stroke-miterlimit="4"
  />

  <!-- Word: "Zoe" (Black) -->
  <text x="18" y="142" class="logo-zoe">Zoe</text>

  <!-- Word: "Digitals" (Green) -->
  <text x="238" y="142" class="logo-digitals">Digitals</text>
</svg>
